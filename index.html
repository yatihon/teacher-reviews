<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier — отзывы о преподавателях</title>
<meta name="description" content="Отзывы студентов о преподавателях. Ничего лишнего.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__eyebrow">так называемое досье</span>
      <h1 class="brand__title">Dossier</h1>
      <p class="brand__tagline">Ищите преподавателя по фамилии или предмету — и узнавайте, что о нем говорят те, кто уже бывал на вашем месте.</p>
    </div>

    <div class="header-actions">
      <a class="predlozhka" href="https://forms.gle/TMR4T9ah87E6NMoB7" target="_blank" rel="noopener">
        <span class="predlozhka__pinhead" aria-hidden="true"></span>
        Предложка
      </a>

      <a class="telegram-btn" href="https://t.me/itmodossier" target="_blank" rel="noopener">
        <span class="telegram-btn__pinhead" aria-hidden="true"></span>
        Канал проекта
      </a>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar__inner">
    <div class="field field--search">
      <label for="search-input" class="field__label">Поиск</label>
      <input id="search-input" type="search" placeholder="Фамилия преподавателя или предмет…" autocomplete="off">
    </div>

    <div class="field field--select">
      <label for="subject-filter" class="field__label">Предмет</label>
      <select id="subject-filter">
        <option value="all">Все предметы</option>
      </select>
    </div>

    <div class="field field--sort">
      <span class="field__label">Сортировка</span>
      <div class="sort-toggle" role="group" aria-label="Сортировка карточек">
        <button type="button" data-sort="subject" class="active" aria-pressed="true">По предмету</button>
        <button type="button" data-sort="teacher" aria-pressed="false">По ФИО</button>
      </div>
    </div>
  </div>
  <p id="results-count" class="results-count" aria-live="polite"></p>
</div>

<main id="results" aria-live="polite"></main>

<footer class="site-footer">
  <p>Отзывы добавляют сами студенты через предложку. 
    В отзывах сохраняются оставленные текст и пунктуация.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
